  <text x="276" y="202" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="9">Kubernetes</text>

  <rect x="318" y="188" width="58" height="20" rx="10" fill="#1a3a2a" stroke="#238636" stroke-width="1"/>
  <text x="347" y="202" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="9">Terraform</text>

  <rect x="382" y="188" width="52" height="20" rx="10" fill="#3d2e0a" stroke="#9e6a03" stroke-width="1"/>
  <text x="408" y="202" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="9">Jenkins</text>

  <rect x="440" y="188" width="56" height="20" rx="10" fill="#1f3d5e" stroke="#1f6feb" stroke-width="1"/>
  <text x="468" y="202" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="9">Argo CD</text>

  <rect x="240" y="214" width="42" height="20" rx="10" fill="#1a3a2a" stroke="#238636" stroke-width="1"/>
  <text x="261" y="228" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="9">AWS</text>

  <rect x="288" y="214" width="52" height="20" rx="10" fill="#3d2e0a" stroke="#9e6a03" stroke-width="1"/>
  <text x="314" y="228" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="9">Docker</text>

  <rect x="346" y="214" width="58" height="20" rx="10" fill="#1f3d5e" stroke="#1f6feb" stroke-width="1"/>
  <text x="375" y="228" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="9">Grafana</text>

  <rect x="410" y="214" width="76" height="20" rx="10" fill="#1a3a2a" stroke="#238636" stroke-width="1"/>
  <text x="448" y="228" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="9">Prometheus</text>

  <rect x="240" y="240" width="46" height="20" rx="10" fill="#3d2e0a" stroke="#9e6a03" stroke-width="1"/>
  <text x="263" y="254" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="9">Istio</text>

  <rect x="292" y="240" width="42" height="20" rx="10" fill="#1f3d5e" stroke="#1f6feb" stroke-width="1"/>
  <text x="313" y="254" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="9">Helm</text>

  <rect x="340" y="240" width="46" height="20" rx="10" fill="#1a3a2a" stroke="#238636" stroke-width="1"/>
  <text x="363" y="254" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="9">Linux</text>

  <rect x="392" y="240" width="54" height="20" rx="10" fill="#3d2e0a" stroke="#9e6a03" stroke-width="1"/>
  <text x="419" y="254" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="9">Python</text>

  <!-- Panel 6: Activity -->
  <rect x="520" y="160" width="304" height="108" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="532" y="180" fill="#8b949e" font-family="monospace" font-size="10">LATEST ACTIVITY</text>

  <!-- Activity log entries -->
  <text x="532" y="198" fill="#3fb950" font-family="monospace" font-size="10">▸ deployed register-app to EKS</text>
  <text x="776" y="198" fill="#484f58" font-family="monospace" font-size="9">2m</text>

  <text x="532" y="216" fill="#58a6ff" font-family="monospace" font-size="10">▸ merged PR #42 gitops-manifests</text>
  <text x="776" y="216" fill="#484f58" font-family="monospace" font-size="9">1h</text>

  <text x="532" y="234" fill="#d29922" font-family="monospace" font-size="10">▸ scaled pods 3→5 prod-eks-01</text>
  <text x="776" y="234" fill="#484f58" font-family="monospace" font-size="9">3h</text>

  <text x="532" y="252" fill="#3fb950" font-family="monospace" font-size="10">▸ pipeline green ✓ 12/12 stages</text>
  <text x="776" y="252" fill="#484f58" font-family="monospace" font-size="9">5h</text>

  <!-- Scanning line effect -->
  <rect x="0" y="0" width="840" height="2" rx="1" fill="#58a6ff" opacity="0.3">
    <animate attributeName="y" values="0;280;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.3;0" dur="8s" repeatCount="indefinite"/>
  </rect>
