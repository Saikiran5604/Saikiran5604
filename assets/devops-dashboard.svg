  <text x="28" y="220" fill="#c9d1d9" font-family="monospace" font-size="10">MEM</text>
  <rect x="60" y="212" width="140" height="10" rx="3" fill="#21262d"/>
  <rect x="60" y="212" width="75" height="10" rx="3" fill="url(#bar2)">
    <animate attributeName="width" values="75;80;70;75" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="165" y="220" fill="#3fb950" font-family="monospace" font-size="9">54%</text>

  <!-- Pods Bar -->
  <text x="28" y="240" fill="#c9d1d9" font-family="monospace" font-size="10">PODS</text>
  <rect x="60" y="232" width="140" height="10" rx="3" fill="#21262d"/>
  <rect x="60" y="232" width="112" height="10" rx="3" fill="url(#bar3)">
    <animate attributeName="width" values="112;120;108;112" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <text x="165" y="240" fill="#d29922" font-family="monospace" font-size="9">80%</text>

