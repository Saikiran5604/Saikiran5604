<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="840" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="line1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="line2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9e6a03"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="280" rx="12" fill="url(#bg)"/>
  <rect width="840" height="280" rx="12" stroke="#30363d" stroke-width="1" fill="none"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="840" height="36" rx="12" fill="#161b22"/>
  <rect x="0" y="12" width="840" height="24" fill="#161b22"/>
  <line x1="0" y1="36" x2="840" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="18" r="5" fill="#f85149"/>
  <circle cx="38" cy="18" r="5" fill="#d29922"/>
  <circle cx="56" cy="18" r="5" fill="#3fb950"/>
  <text x="420" y="22" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12">saikiran@devops ~ dashboard</text>

  <!-- Panel 1: Cluster Status -->
  <rect x="16" y="48" width="200" height="100" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="28" y="68" fill="#8b949e" font-family="monospace" font-size="10">CLUSTER STATUS</text>

  <!-- Status rows with pulsing dots -->
  <circle cx="32" cy="84" r="4" fill="#3fb950" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="88" fill="#c9d1d9" font-family="monospace" font-size="11">prod-eks-01</text>
  <text x="170" y="88" fill="#3fb950" font-family="monospace" font-size="10">LIVE</text>

  <circle cx="32" cy="104" r="4" fill="#3fb950" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="108" fill="#c9d1d9" font-family="monospace" font-size="11">prod-eks-02</text>
  <text x="170" y="108" fill="#3fb950" font-family="monospace" font-size="10">LIVE</text>

  <circle cx="32" cy="124" r="4" fill="#3fb950" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="128" fill="#c9d1d9" font-family="monospace" font-size="11">staging-01</text>
  <text x="170" y="128" fill="#3fb950" font-family="monospace" font-size="10">LIVE</text>

  <circle cx="32" cy="144" r="4" fill="#d29922">
    <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="148" fill="#c9d1d9" font-family="monospace" font-size="11">dev-local</text>
  <text x="158" y="148" fill="#d29922" font-family="monospace" font-size="10">SCALE</text>

  <!-- Panel 2: Live Metrics Graph -->
  <rect x="228" y="48" width="280" height="100" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="240" y="68" fill="#8b949e" font-family="monospace" font-size="10">REQUEST LATENCY (ms)</text>

  <!-- Animated line graph -->
  <polyline points="240,130 260,120 280,125 300,110 320,115 340,100 360,108 380,95 400,105 420,98 440,90 460,102 480,92 495,96"
            stroke="url(#line1)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <animate attributeName="points"
             values="240,130 260,120 280,125 300,110 320,115 340,100 360,108 380,95 400,105 420,98 440,90 460,102 480,92 495,96;
                     240,125 260,128 280,115 300,120 320,105 340,112 360,98 380,108 400,95 420,105 440,100 460,92 480,98 495,90;
                     240,130 260,120 280,125 300,110 320,115 340,100 360,108 380,95 400,105 420,98 440,90 460,102 480,92 495,96"
             dur="4s" repeatCount="indefinite"/>
  </polyline>

  <!-- Second line (throughput) -->
  <polyline points="240,135 260,132 280,138 300,128 320,135 340,125 360,130 380,120 400,128 420,118 440,125 460,115 480,122 495,118"
            stroke="url(#line2)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <animate attributeName="points"
             values="240,135 260,132 280,138 300,128 320,135 340,125 360,130 380,120 400,128 420,118 440,125 460,115 480,122 495,118;
                     240,138 260,135 280,130 300,135 320,128 340,132 360,122 380,128 400,118 420,125 440,115 460,122 480,112 495,120;
                     240,135 260,132 280,138 300,128 320,135 340,125 360,130 380,120 400,128 420,118 440,125 460,115 480,122 495,118"
