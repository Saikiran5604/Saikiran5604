  <rect x="532" y="78" width="56" height="22" rx="4" fill="#238636"/>
  <text x="560" y="93" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9">BUILD</text>

  <text x="594" y="93" fill="#30363d" font-family="monospace" font-size="14">→</text>

  <rect x="608" y="78" width="52" height="22" rx="4" fill="#238636"/>
  <text x="634" y="93" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9">SCAN</text>

  <text x="666" y="93" fill="#30363d" font-family="monospace" font-size="14">→</text>

  <rect x="680" y="78" width="52" height="22" rx="4" fill="#238636"/>
  <text x="706" y="93" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9">TEST</text>

  <text x="738" y="93" fill="#30363d" font-family="monospace" font-size="14">→</text>

