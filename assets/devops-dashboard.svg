  <text x="240" y="145" fill="#58a6ff" font-family="monospace" font-size="9">● p99</text>
  <text x="280" y="145" fill="#3fb950" font-family="monospace" font-size="9">● p50</text>
  <text x="440" y="80" fill="#58a6ff" font-family="monospace" font-size="18" font-weight="bold">42ms
