  <rect x="520" y="48" width="304" height="100" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="532" y="68" fill="#8b949e" font-family="monospace" font-size="10">CI/CD PIPELINE</text>

